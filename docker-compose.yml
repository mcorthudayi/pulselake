services:
  postgres:
    image: postgres:16
    container_name: pulselake-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulselake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pulselake}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulselake} -d ${POSTGRES_DB:-pulselake}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
