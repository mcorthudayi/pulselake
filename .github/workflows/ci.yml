name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit -r ingestion/requirements.txt -r transform/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm dependency audit
        working-directory: portal
        run: |
          npm ci
          npm audit --omit=dev

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: NuGet dependency audit
        run: |
          dotnet restore api/PulseLake.Api
          dotnet list api/PulseLake.Api package --vulnerable --include-transitive | tee nuget-audit.txt
          if grep -q "has the following vulnerable packages" nuget-audit.txt; then exit 1; fi

  pipeline:
    name: End-to-end pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ingestion/requirements.txt
            transform/requirements.txt

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache Synthea
        uses: actions/cache@v4
        with:
          path: tools
          key: synthea-${{ runner.os }}-v1

      - name: Create CI environment
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i "s/^API_DB_PASSWORD=.*/API_DB_PASSWORD=$(openssl rand -hex 24)/" .env

      - name: Install Python dependencies
        run: pip install -r ingestion/requirements.txt -r transform/requirements.txt

      - name: Run pipeline
        env:
          POPULATION: "25"
        run: ./scripts/pipeline.sh

      - name: Verify idempotent re-ingestion
        run: |
          python ingestion/load_fhir.py 2>&1 | tee reload.log
          grep -q "inserted=0 updated=0" reload.log

      - name: Start API
        run: |
          dotnet user-jwts create --project api/PulseLake.Api --name ci.bootstrap --role auditor --output token > /dev/null
          nohup ./scripts/api.sh > api.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -sf http://localhost:5080/health; then exit 0; fi
            sleep 2
          done
          cat api.log
          exit 1

      - name: Smoke test
        run: ./scripts/smoke_test.sh

      - name: API log
        if: failure()
        run: cat api.log || true

  portal:
    name: Portal build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - run: npm ci
      - run: npm run build
